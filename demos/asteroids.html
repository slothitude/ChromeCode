<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroids — SlothitudeGames</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: monospace; color: #0f0; }
canvas { display: block; border: 1px solid #0f04; }
#brand { position: fixed; bottom: 16px; display: flex; align-items: center; gap: 12px; opacity: 0.7; }
#brand .sloth { font-size: 36px; animation: float 3s ease-in-out infinite; }
#brand .name { font-size: 14px; letter-spacing: 3px; text-transform: uppercase; }
#toggle-hint { position: fixed; top: 8px; right: 12px; font-size: 11px; color: #0f08; z-index: 10; }
canvas.paused { display: none; }
@keyframes float { 0%,100%{transform:translateY(0) rotate(0deg)} 25%{transform:translateY(-8px) rotate(5deg)} 50%{transform:translateY(-4px) rotate(-3deg)} 75%{transform:translateY(-10px) rotate(3deg)} }
</style>
</head>
<body>
<div id="toggle-hint">GRAVE (`) = toggle game</div>
<canvas id="c"></canvas>
<div id="brand">
  <span class="sloth">🦥</span>
  <span class="name">SlothitudeGames</span>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const W = canvas.width, H = canvas.height;

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

const keys = {};
let ship, bullets, rocks, particles, score, level, lives, gameOver, respawnTimer, levelBanner;
const LARGE = 45, MED = 22, SMALL = 11;
const PTS = {}; PTS[LARGE] = 20; PTS[MED] = 50; PTS[SMALL] = 100;

function resetGame() {
  ship = { x: W / 2, y: H / 2, a: -Math.PI / 2, invincible: 120 };
  bullets = []; rocks = []; particles = [];
  score = 0; level = 1; lives = 3; gameOver = false; respawnTimer = 0; levelBanner = 120;
  spawnWave();
}

function spawnWave() {
  const count = 3 + level * 2;
  for (let i = 0; i < count; i++) {
    let x, y;
    do { x = Math.random() * W; y = Math.random() * H; } while (dst(x, y, ship.x, ship.y) < 150);
    mkRock(x, y, LARGE);
  }
  levelBanner = 120;
}

function dst(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

function mkRock(x, y, sz) {
  const n = Math.floor(Math.random() * 4) + 7;
  const pts = [];
  for (let i = 0; i < n; i++) pts.push({ a: (i / n) * Math.PI * 2, r: sz * 0.6 + Math.random() * sz * 0.5 });
  const speed = 0.5 + level * 0.15 + Math.random() * 1.5;
  const angle = Math.random() * Math.PI * 2;
  rocks.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, sz, rot: 0, rv: (Math.random() - 0.5) * 0.04, pts });
}

function boom(x, y, n, col) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 3 + 1;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: Math.random() * 30 + 20, col: col || '#0f0' });
  }
}

function killShip() {
  boom(ship.x, ship.y, 20, '#f44');
  lives--;
  if (lives <= 0) gameOver = true;
  else respawnTimer = 90;
}

document.addEventListener('keydown', e => {
  if (e.code === 'Backquote') {
    e.preventDefault();
    paused = !paused;
    canvas.classList.toggle('paused', paused);
    if (!paused) requestAnimationFrame(loop);
    return;
  }
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'KeyE') {
    e.preventDefault();
    if (!gameOver && respawnTimer <= 0 && !paused)
      bullets.push({ x: ship.x + Math.cos(ship.a) * 18, y: ship.y + Math.sin(ship.a) * 18, vx: Math.cos(ship.a) * 8, vy: Math.sin(ship.a) * 8, life: 60 });
  }
  if (e.code === 'KeyR' && gameOver) resetGame();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function wrapObj(o) {
  if (o.x < -60) o.x = W + 60; if (o.x > W + 60) o.x = -60;
  if (o.y < -60) o.y = H + 60; if (o.y > H + 60) o.y = -60;
}

function drawShip() {
  if (respawnTimer > 0) return;
  if (ship.invincible > 0 && Math.floor(ship.invincible / 4) % 2) return;
  ctx.save(); ctx.translate(ship.x, ship.y); ctx.rotate(ship.a);
  ctx.strokeStyle = '#0f0'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-12, 10); ctx.lineTo(-7, 0); ctx.lineTo(-12, -10); ctx.closePath(); ctx.stroke();
  if (keys.KeyW || keys.ArrowUp) {
    ctx.strokeStyle = '#ff0'; ctx.beginPath(); ctx.moveTo(-9, 5); ctx.lineTo(-16, 0); ctx.lineTo(-9, -5); ctx.stroke();
  }
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = '#0f0'; ctx.font = '16px monospace'; ctx.textAlign = 'left';
  ctx.fillText('SCORE: ' + score, 20, 30);
  ctx.fillText('LEVEL: ' + level, 20, 50);
  let ls = ''; for (let i = 0; i < lives; i++) ls += '\u25B6 ';
  ctx.fillText('LIVES: ' + ls, 20, 70);
  ctx.font = '12px monospace'; ctx.fillText('WASD / Arrows = move  |  SPACE / E = shoot  |  R = restart', 20, H - 40);

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(W / 2 - 200, H / 2 - 80, 400, 160);
    ctx.fillStyle = '#f44'; ctx.font = 'bold 36px monospace'; ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 20);
    ctx.fillStyle = '#0f0'; ctx.font = '20px monospace';
    ctx.fillText('Score: ' + score + '   Level: ' + level, W / 2, H / 2 + 20);
    ctx.font = '14px monospace'; ctx.fillText('Press R to restart', W / 2, H / 2 + 50);
    ctx.textAlign = 'left';
  }

  if (levelBanner > 0) {
    ctx.fillStyle = 'rgba(0,255,0,' + Math.min(levelBanner / 60, 1) + ')';
    ctx.font = 'bold 32px monospace'; ctx.textAlign = 'center';
    ctx.fillText('LEVEL ' + level, W / 2, H / 2);
    ctx.textAlign = 'left';
  }
}

function loop() {
  ctx.clearRect(0, 0, W, H);

  if (!gameOver) {
    if (keys.KeyA || keys.ArrowLeft) ship.a -= 0.07;
    if (keys.KeyD || keys.ArrowRight) ship.a += 0.07;
    if (keys.KeyW || keys.ArrowUp) { ship.x += Math.cos(ship.a) * 4; ship.y += Math.sin(ship.a) * 4; }
    if (keys.KeyS || keys.ArrowDown) { ship.x -= Math.cos(ship.a) * 2; ship.y -= Math.sin(ship.a) * 2; }
    wrapObj(ship);
    if (ship.invincible > 0) ship.invincible--;
    if (respawnTimer > 0) {
      respawnTimer--;
      if (respawnTimer === 0) { ship.x = W / 2; ship.y = H / 2; ship.a = -Math.PI / 2; ship.invincible = 120; }
    }
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i]; b.x += b.vx; b.y += b.vy; b.life--;
    if (b.life <= 0 || b.x < 0 || b.x > W || b.y < 0 || b.y > H) { bullets.splice(i, 1); continue; }
    ctx.fillStyle = '#0f0'; ctx.beginPath(); ctx.arc(b.x, b.y, 2, 0, Math.PI * 2); ctx.fill();
  }

  for (let i = rocks.length - 1; i >= 0; i--) {
    const r = rocks[i]; r.x += r.vx; r.y += r.vy; r.rot += r.rv; wrapObj(r);
    ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
    ctx.strokeStyle = '#0f0'; ctx.lineWidth = 1.5; ctx.beginPath();
    r.pts.forEach((p, j) => { const px = Math.cos(p.a) * p.r; const py = Math.sin(p.a) * p.r; j === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py); });
    ctx.closePath(); ctx.stroke(); ctx.restore();

    let hit = false;
    for (let j = bullets.length - 1; j >= 0; j--) {
      if (dst(r.x, r.y, bullets[j].x, bullets[j].y) < r.sz) {
        score += PTS[r.sz] || 10; boom(r.x, r.y, 10, '#0f0');
        if (r.sz === LARGE) { mkRock(r.x, r.y, MED); mkRock(r.x, r.y, MED); }
        else if (r.sz === MED) { mkRock(r.x, r.y, SMALL); mkRock(r.x, r.y, SMALL); }
        bullets.splice(j, 1); rocks.splice(i, 1); hit = true; break;
      }
    }
    if (hit) continue;
    if (!gameOver && respawnTimer <= 0 && ship.invincible <= 0 && dst(r.x, r.y, ship.x, ship.y) < r.sz + 10) killShip();
  }

  if (rocks.length === 0 && !gameOver) { level++; spawnWave(); }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life / 50; ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
  }

  if (!gameOver) drawShip();
  if (levelBanner > 0) levelBanner--;
  drawHUD();
  if (!paused) requestAnimationFrame(loop);
}

let paused = false;

resetGame();
loop();
</script>
</body>
</html>
