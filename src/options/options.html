<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ChromeCode Options</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #1e1e1e; color: #fff; max-width: 700px; margin: 0 auto; }
    h1 { border-bottom: 1px solid #333; padding-bottom: 8px; }

    .provider-list { margin-bottom: 15px; }
    .provider-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; margin-bottom: 6px;
      background: #2a2a2a; border: 1px solid #444; border-radius: 6px;
    }
    .provider-row.active { border-color: #0e639c; background: #253040; }
    .provider-row input[type="radio"] { margin: 0; accent-color: #0e639c; }
    .provider-name { flex: 1; font-weight: 500; }
    .provider-model { font-size: 12px; color: #999; }
    .provider-row .btn-icon {
      background: none; border: none; color: #aaa; cursor: pointer;
      font-size: 16px; padding: 2px 6px; border-radius: 4px;
    }
    .provider-row .btn-icon:hover { color: #fff; background: #444; }
    .provider-row .btn-icon.delete:hover { color: #ff6b6b; background: #442222; }

    .add-btn { padding: 8px 16px; background: #0e639c; color: #fff; border: none; cursor: pointer; border-radius: 4px; }
    .add-btn:hover { background: #1177bb; }

    #edit-panel {
      display: none; margin-top: 15px; padding: 16px;
      background: #2a2a2a; border: 1px solid #444; border-radius: 6px;
    }
    #edit-panel.open { display: block; }
    .field { margin-bottom: 12px; }
    .field label { display: block; margin-bottom: 4px; font-size: 13px; color: #ccc; }
    .field input {
      width: 100%; padding: 8px; background: #3c3c3c; border: 1px solid #555;
      color: #fff; box-sizing: border-box; border-radius: 4px;
    }
    .edit-actions { display: flex; gap: 8px; margin-top: 12px; }
    .edit-actions button { padding: 8px 16px; border: none; cursor: pointer; border-radius: 4px; }
    .btn-save { background: #0e639c; color: #fff; }
    .btn-save:hover { background: #1177bb; }
    .btn-cancel { background: #555; color: #fff; }
    .btn-cancel:hover { background: #666; }

    #status { margin-top: 10px; color: #4caf50; font-size: 13px; }
  </style>
</head>
<body>
  <h1>ChromeCode Providers</h1>
  <div id="provider-list" class="provider-list"></div>
  <button id="add-btn" class="add-btn">+ Add Provider</button>

  <div id="edit-panel">
    <div class="field">
      <label>Name</label>
      <input type="text" id="edit-name">
    </div>
    <div class="field">
      <label>API Key</label>
      <input type="password" id="edit-apikey">
    </div>
    <div class="field">
      <label>Base URL</label>
      <input type="text" id="edit-baseurl">
    </div>
    <div class="field">
      <label>Model ID</label>
      <input type="text" id="edit-modelid">
    </div>
    <div class="edit-actions">
      <button id="edit-save" class="btn-save">Save</button>
      <button id="edit-cancel" class="btn-cancel">Cancel</button>
    </div>
  </div>

  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
