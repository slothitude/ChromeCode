<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ChromeCode</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>ChromeCode</h1>
      <div class="actions">
        <button id="clear-btn" title="Clear History">🧹</button>
        <button id="connect-folder">Connect Folder</button>
      </div>
    </header>
    <div id="chat-container">
      <div id="messages"></div>
    </div>
    <div id="input-area">
      <textarea id="prompt-input" placeholder="Ask ChromeCode..."></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
